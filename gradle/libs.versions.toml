[metadata]
format.version = "1.1"

[versions]
assertj = "3.27.7"
awaitility = "4.3.0"
bouncycastle = "1.85.2"
dcp-tck = "1.1.0"
jackson = "3.2.2"
json-schema-validator = "3.0.7"
junit = "6.1.3"
nimbus = "10.9.1"
okhttp = "5.5.0"
tck = "1.3.0"

[libraries]

tck-common-api = { module = "org.eclipse.dataspacetck.common:core-api", version.ref = "tck" }
tck-core = { module = "org.eclipse.dataspacetck.common:core", version.ref = "tck" }
tck-runtime = { module = "org.eclipse.dataspacetck.common:tck-runtime", version.ref = "tck" }

assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
dcp-system = { module = "org.eclipse.dataspacetck.dcp:dcp-system", version.ref = "dcp-tck" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
nimbus-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-platform-engine = { module = "org.junit.platform:junit-platform-suite-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
tck-build = { id = "org.eclipse.dataspacetck.build.tck-build", version = "1.2.2" }
